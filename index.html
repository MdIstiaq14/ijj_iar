<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শুভ জন্মদিন 🎂</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;800&family=Hind+Siliguri:wght@400;500&display=swap">
<style>
:root{--bg1:#FFF3E0;--bg2:#FFD6E4;--ink:#3A1E4A;--rose:#FF5C8A;--gold:#FFB627;--teal:#2EC4B6;--cake:#FFF9F0;--frost:#FF8FB1;--sponge:#FFD59E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1B1030;--bg2:#3A1E4A;--ink:#FFF3E0;--cake:#FFF3E0}}
:root[data-theme="dark"]{--bg1:#1B1030;--bg2:#3A1E4A;--ink:#FFF3E0;--cake:#FFF3E0}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 100%,var(--bg2),var(--bg1));color:var(--ink);font-family:'Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;overflow:hidden;text-align:center}
h1,.btn{font-family:'Baloo Da 2','Hind Siliguri',system-ui,sans-serif}
#gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px}
#stage{position:absolute;inset:0;display:none;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
#pan{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;will-change:transform}
#core{position:absolute;left:0;top:0;width:320px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:18px}
#balloons{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1;display:none}
.ph{position:absolute;width:170px;padding:8px 8px 0;background:#fff;border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.3);opacity:0;transform:rotate(var(--r));cursor:zoom-in;color:#3A1E4A}
.ph img{display:block;width:100%;aspect-ratio:5/6;object-fit:cover;pointer-events:none}
.ph span{display:block;padding:8px 0 10px;font-size:14px;font-weight:500}
.ph.land{animation:land .9s var(--d) cubic-bezier(.3,1.4,.5,1) both}
@keyframes land{0%{opacity:0;transform:translateY(-1200px) rotate(calc(var(--r)*5))}15%{opacity:1}100%{opacity:1;transform:translateY(0) rotate(var(--r))}}
#hbd{display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:6px;position:relative;z-index:2}
.hrow{display:flex;gap:4px;justify-content:center}
.bl{position:relative;width:34px;height:42px;border-radius:50% 50% 48% 48%;background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);font-family:'Baloo Da 2',sans-serif;font-weight:800;font-size:20px;box-shadow:inset -5px -6px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.28);animation:bpop .6s calc(var(--n)*.08s) backwards cubic-bezier(.3,1.6,.5,1),bob 2.4s calc(var(--n)*.12s) ease-in-out infinite}
.bl::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:12px;background:var(--c);opacity:.55}
@keyframes bpop{from{scale:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-11px) rotate(4deg)}}
#cal{width:252px;background:var(--cake);color:#3A1E4A;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.22);position:relative;z-index:2;margin-top:6px}
.ch{background:var(--rose);color:#fff;font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-weight:800;font-size:1.05rem;padding:6px 0}
.cg{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 8px 4px;row-gap:2px}
.cg b{font-size:12px;color:var(--rose)}
.cg span,.cg i{height:30px;line-height:30px;font-size:13px;position:relative}
.cg .bd{background:var(--rose);color:#fff;border-radius:50%;font-weight:800;animation:beatd 1s ease-in-out infinite}
.cg .bd::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--rose);animation:ring 1.6s ease-out infinite}
@keyframes beatd{50%{transform:scale(1.18)}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2);opacity:0}}
.cf{font-size:13px;font-weight:500;padding:4px 6px 10px}
.ui{position:fixed;z-index:6;cursor:pointer}
#lbtn{left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:12px 20px;font-size:1.05rem;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
#zc{right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.zb{width:44px;height:44px;padding:0;font-size:1.3rem;background:var(--ink);color:var(--bg1)}
#tip{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;z-index:6;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .6s}
#tip.on{opacity:.85}
#box,#letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:20px;background:rgba(15,8,25,.86)}
#box.on,#letter.on{display:flex}
#box figure{background:#fff;padding:12px 12px 4px;border-radius:6px;max-width:94vw;color:#3A1E4A;animation:pop .35s cubic-bezier(.2,1.3,.4,1)}
#bimg{display:block;max-width:100%;max-height:72vh}
#box figcaption{padding:10px 0 8px;font-weight:500}
@keyframes pop{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.paper{width:min(360px,100%);max-height:82vh;overflow:auto;background-color:#FFF9F0;background-image:repeating-linear-gradient(transparent 0 31px,rgba(255,92,138,.22) 31px 32px);color:#3A1E4A;padding:26px 24px;border-radius:6px;text-align:left;line-height:32px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform-origin:top;animation:unfold .55s cubic-bezier(.2,1.2,.4,1)}
.paper p{white-space:pre-line}
.w{display:inline-block;opacity:0;transform:translateY(10px);animation:wi .55s var(--wd) ease-out forwards}
.fi{opacity:0;animation:wi .8s forwards}
@keyframes wi{to{opacity:1;transform:none}}
#lto{font-family:'Baloo Da 2','Hind Siliguri',sans-serif;font-size:1.25rem;font-weight:800}
@keyframes unfold{from{transform:perspective(900px) rotateX(-80deg) scale(.6);opacity:0}}
.btn{background:var(--rose);color:#fff;border:0;border-radius:999px;padding:14px 30px;font-size:1.15rem;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.gift{font-size:5.5rem;animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
h1{font-size:clamp(2rem,9vw,3.2rem);font-weight:800;line-height:1.1;position:relative;z-index:2}
#msg{min-height:5.5em;max-width:30ch;font-size:1.1rem;line-height:1.6;position:relative;z-index:2}
.cake{position:relative;width:210px;height:170px;margin-top:40px;z-index:2}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.t1{bottom:0;width:210px;height:70px;background:var(--sponge);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.t2{bottom:70px;width:150px;height:58px;background:var(--sponge);box-shadow:inset 0 -10px 0 rgba(0,0,0,.08)}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:22px;background:var(--frost);border-radius:14px 14px 18px 18px}
.plate{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:240px;height:12px;border-radius:50%;background:var(--cake);opacity:.9}
.candles{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);display:flex;gap:22px}
.c{position:relative;width:12px;height:42px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--teal) 0 6px,var(--cake) 6px 12px)}
.f{position:absolute;left:50%;top:-26px;width:14px;height:24px;margin-left:-7px;background:radial-gradient(circle at 50% 70%,#fff 10%,var(--gold) 45%,#FF7A18 100%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:fl .35s ease-in-out infinite alternate;box-shadow:0 0 18px 6px rgba(255,182,39,.55);transition:opacity .4s,transform .4s}
.c:nth-child(2) .f{animation-delay:.12s}.c:nth-child(3) .f{animation-delay:.22s}
@keyframes fl{from{transform:scale(1,1) rotate(-4deg)}to{transform:scale(.88,1.1) rotate(4deg)}}
.out .f{opacity:0;animation:none;transform:scale(.2)}
.smoke{position:absolute;left:50%;top:-30px;width:6px;height:6px;border-radius:50%;background:#999;opacity:0}
.out .smoke{animation:sm 1.4s ease-out}
@keyframes sm{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-50px) scale(3)}}
.b{position:absolute;bottom:-90px;width:46px;height:58px;border-radius:50% 50% 48% 48%;animation:rise linear infinite;opacity:.9;z-index:1}
.b::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:50px;background:currentColor;opacity:.4}
@keyframes rise{to{transform:translateY(-120vh) translateX(var(--dx))}}
#cv{position:absolute;inset:0;pointer-events:none;z-index:3}
#hearts{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
#gate{z-index:2}
.hr{position:absolute;bottom:-40px;line-height:1;opacity:0;animation:hrise var(--t) linear forwards,beat .9s ease-in-out infinite}
@keyframes hrise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--dx),-115vh);opacity:0}}
@keyframes beat{50%{scale:1.25}}
#hint{font-size:.95rem;opacity:.75;position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.b,.gift{animation:none}}
</style>
</head>
<body>
<div id="gate">
  <div class="gift" aria-hidden="true">🎁</div>
  <h1 id="gname">তোমার জন্য একটা surprise আছে</h1>
  <button class="btn" id="open">খুলে দেখো</button>
</div>

<div id="hearts" aria-hidden="true"></div>
<div id="balloons" aria-hidden="true"></div>
<div id="stage"><div id="pan"><div id="core">
  <div id="hbd" role="img" aria-label="Happy Birthday"></div>
  <h1 id="title">শুভ জন্মদিন!</h1>
  <div class="cake" id="cake">
    <div class="candles"><div class="c"><i class="f"></i><i class="smoke"></i></div><div class="c"><i class="f"></i><i class="smoke"></i></div><div class="c"><i class="f"></i><i class="smoke"></i></div></div>
    <div class="tier t2"></div><div class="tier t1"></div><div class="plate"></div>
  </div>
  <p id="hint">মোমবাতিগুলো নিভিয়ে ফেলো</p>
  <button class="btn" id="blow">🌬️ ফুঁ দাও</button>
  <p id="msg" aria-live="polite"></p>
  <div id="cal"></div>
</div></div>
<button class="btn ui" id="lbtn">💌 চিঠি</button>
<div class="ui" id="zc"><button class="btn zb" id="snd" aria-label="Sound on or off">🔊</button><button class="btn zb" id="zin" aria-label="Zoom in">+</button><button class="btn zb" id="zout" aria-label="Zoom out">−</button><button class="btn zb" id="zfit" aria-label="Fit all">⤢</button></div>
<p id="tip">টেনে চারদিকে ঘোরাও · দুই আঙুলে zoom করো · ছবিতে ট্যাপ করো</p>
</div>
<canvas id="cv"></canvas>
<div id="box"><figure><img id="bimg" alt=""><figcaption id="bcap"></figcaption></figure></div>
<div id="letter"><div class="paper"><p id="lto"></p><p id="lbody"></p><p id="lfrom"></p></div></div>

<script>
// Customise via link: ?name=Nusrat&msg=Your+message
var q=new URLSearchParams(location.search);
var NAME=q.get('name')||'ইসরাত জাহান';
var MSG=q.get('msg')||'আজকের দিনটা তোমার, তাই আজ শুধু হাসবে, আর স্বপ্নগুলো আরও বড় করবে। তোমার জন্য অনেক ভালোবাসা ও শুভকামনা রইল। 💛';
document.getElementById('title').textContent='শুভ জন্মদিন'+(NAME?', '+NAME:'')+'!';
if(NAME)document.getElementById('gname').textContent=NAME+', তোমার জন্য একটা surprise আছে';

// Balloons
var colors=['#FF5C8A','#FFB627','#2EC4B6','#8E6BFF','#FF7A18'],bl=document.getElementById('balloons');
for(var i=0;i<12;i++){var b=document.createElement('div');b.className='b';
b.style.cssText='left:'+(Math.random()*92)+'%;background:'+colors[i%5]+';color:'+colors[i%5]+';animation-duration:'+(9+Math.random()*7)+'s;animation-delay:'+(Math.random()*8)+'s;--dx:'+((Math.random()-.5)*80)+'px';bl.appendChild(b);}

// Balloon-letter "HAPPY BIRTHDAY" banner + birthday calendar
(function(){var cs=['#FF5C8A','#FFB627','#2EC4B6','#8E6BFF','#FF7A18'],n=0,box=document.getElementById('hbd');
['HAPPY','BIRTHDAY'].forEach(function(w){var r=document.createElement('div');r.className='hrow';
w.split('').forEach(function(ch){var b=document.createElement('div');b.className='bl';b.textContent=ch;b.style.cssText='--c:'+cs[n%5]+';--n:'+n;n++;r.appendChild(b)});box.appendChild(r)})})();
var MN=['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'],WD=['র','সো','ম','বু','বৃ','শু','শ'];
function bn(n){return String(n).replace(/\d/g,function(d){return '০১২৩৪৫৬৭৮৯'[d]})}
(function(){var t=new Date(),m=+(q.get('m')||11),d=+(q.get('d')||2),y=q.get('y')?+q.get('y'):t.getFullYear();
if(!q.get('y')&&new Date(y,m-1,d+1)<t)y++;
var first=new Date(y,m-1,1).getDay(),n=new Date(y,m,0).getDate(),h='<div class="ch">'+MN[m-1]+' '+bn(y)+'</div><div class="cg">';
WD.forEach(function(w){h+='<b>'+w+'</b>'});for(var i=0;i<first;i++)h+='<i></i>';
for(var k=1;k<=n;k++)h+=k==d?'<span class="bd">'+bn(k)+'</span>':'<span>'+bn(k)+'</span>';
document.getElementById('cal').innerHTML=h+'</div><div class="cf">'+bn(d)+' '+MN[m-1]+', তোমার বিশেষ দিন 💛</div>'})();

// Floating hearts (continuous, plus a burst when candles go out)
var HS=['❤️','💖','💕','💗','🩷'],hl=document.getElementById('hearts');
function heart(f){if(hl.children.length>40)return;var h=document.createElement('span');h.className='hr';h.textContent=HS[Math.floor(Math.random()*HS.length)];
h.style.cssText='left:'+(f?15+Math.random()*70:Math.random()*96)+'%;font-size:'+(14+Math.random()*22)+'px;--dx:'+((Math.random()-.5)*120)+'px;--t:'+(6+Math.random()*5)+'s;'+(f?'bottom:'+(15+Math.random()*30)+'%':'');
h.onanimationend=function(e){if(e.animationName=='hrise')h.remove()};hl.appendChild(h)}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)setInterval(function(){if(!document.hidden)heart()},500);
function heartBurst(){for(var i=0;i<22;i++)setTimeout(function(){heart(1)},i*90)}

// Confetti
var cv=document.getElementById('cv'),cx=cv.getContext('2d'),P=[],run=false;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(){var w=cv.width;for(var i=0;i<160;i++){P.push({x:w/2,y:cv.height*.5,vx:(Math.random()-.5)*14,vy:-Math.random()*15-4,r:Math.random()*6+4,c:colors[i%5],a:Math.random()*6,va:(Math.random()-.5)*.4})}
if(!run){run=true;tick()}}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(function(p){return p.y<cv.height+20});
P.forEach(function(p){p.vy+=.35;p.vx*=.992;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()});
if(P.length)requestAnimationFrame(tick);else run=false}

// Happy Birthday melody (WebAudio, no files needed)
var AC;
function play(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();
var N={C:261.63,D:293.66,E:329.63,F:349.23,G:392,A:440,Bb:466.16,C2:523.25};
var s=[['C',.75],['C',.25],['D',1],['C',1],['F',1],['E',2],['C',.75],['C',.25],['D',1],['C',1],['G',1],['F',2],['C',.75],['C',.25],['C2',1],['A',1],['F',1],['E',1],['D',1],['Bb',.75],['Bb',.25],['A',1],['F',1],['G',1],['F',2]];
duck(11.5);var t=AC.currentTime+.1,beat=.45;
s.forEach(function(n){var o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=N[n[0]];
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.25,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+n[1]*beat);

function initView(){S=Math.min(1,innerHeight/(document.getElementById('core').offsetHeight+90));TX=0;TY=0;apply()}
function fit(){var ts=Math.max(.5,Math.min(innerWidth/900,innerHeight/1600)),s0=S,x0=TX,y0=TY,t0=performance.now();
(function f(t){var k=Math.min(1,(t-t0)/1400),e=1-Math.pow(1-k,3);S=s0+(ts-s0)*e;TX=x0*(1-e);TY=y0*(1-e);apply();if(k<1)requestAnimationFrame(f)})(t0)}
var ptrs={},moved=0,pd=0;
st.addEventListener('pointerdown',function(e){if(e.target.closest('.ui'))return;ptrs[e.pointerId]={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY};moved=0;pd=Object.keys(ptrs).length});
st.addEventListener('pointermove',function(e){var p=ptrs[e.pointerId];if(!p)return;var ids=Object.keys(ptrs);
if(ids.length==2){var o=ptrs[ids[0]==e.pointerId?ids[1]:ids[0]],d0=Math.hypot(p.x-o.x,p.y-o.y);p.x=e.clientX;p.y=e.clientY;var d1=Math.hypot(p.x-o.x,p.y-o.y);
if(d0>0)zoomAt(d1/d0,(p.x+o.x)/2-innerWidth/2,(p.y+o.y)/2-innerHeight/2);moved=99;return}
var dx=e.clientX-p.x,dy=e.clientY-p.y;moved=Math.max(moved,Math.hypot(e.clientX-p.sx,e.clientY-p.sy));
if(moved>12){try{st.setPointerCapture(e.pointerId)}catch(x){}TX+=dx;TY+=dy;clampV();apply()}
p.x=e.clientX;p.y=e.clientY});
function up(e){var had=ptrs[e.pointerId];delete ptrs[e.pointerId];
if(had&&moved<=12&&pd==1&&e.type=='pointerup'){var el=(e.target&&e.target.closest)?e.target:document.elementFromPoint(e.clientX,e.clientY),f=el&&el.closest('.ph')||(document.elementFromPoint(e.clientX,e.clientY)||document.body).closest('.ph');if(f)openBox(+f.dataset.i)}}
st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
st.addEventListener('wheel',function(e){e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX-innerWidth/2,e.clientY-innerHeight/2)},{passive:false});
document.getElementById('zin').onclick=function(){zoomAt(1.3,0,0)};
document.getElementById('zout').onclick=function(){zoomAt(1/1.3,0,0)};
document.getElementById('zfit').onclick=fit;

var LETTER=q.get('letter')||'আজ তোমার জন্মদিন, আর আমার কাছে এটা পৃথিবীর সবচেয়ে সুন্দর দিনগুলোর একটা।\n\nতুমি যেদিন থেকে আমার জীবনে এসেছ, সবকিছু একটু বেশি সুন্দর হয়ে গেছে। তোমার হাসি আমার সব ক্লান্তি মুছে দেয়, আর তোমার একটা কথাই আমার পুরো দিনটা বদলে দিতে পারে।\n\nআমি জানি আমি পারফেক্ট না, তবুও তুমি আমাকে যেভাবে ভালোবাসো, সেটাই আমার সবচেয়ে বড় পাওয়া।\n\nআজ আমার একটাই চাওয়া, তুমি সবসময় এভাবেই হাসবে, আর আমি যেন সারাজীবন তোমার পাশে থাকতে পারি।\n\nজন্মদিনের অনেক অনেক ভালোবাসা, আমার একমাত্র ইসরাত। 💛';
var FROM=q.get('from')||'ইসতিয়াক';
document.getElementById('lto').textContent='প্রিয় '+(NAME||'বন্ধু')+',';

function openLetter(){lt.classList.add('on');var pp=lt.querySelector('.paper'),b=document.getElementById('lbody'),n=0,ws=[];b.textContent='';
LETTER.split(/(\s+)/).forEach(function(t){if(!t)return;if(/^\s+$/.test(t)){b.appendChild(document.createTextNode(t))}else{var s=document.createElement('span');s.className='w';s.textContent=t;s.style.setProperty('--wd',(.9+n*.14)+'s');ws.push(s);n++;b.appendChild(s)}});

a.style.animationDelay='.1s';f.style.animationDelay=(1.2+n*.14)+'s';
clearInterval(lTimer);pp.scrollTop=0;var t0=Date.now();

var k=Math.floor(((Date.now()-t0)/1000-.9)/.14),w=ws[Math.min(k,ws.length-1)];
if(w){var r=w.getBoundingClientRect(),pr=pp.getBoundingClientRect();if(r.bottom>pr.bottom-50)pp.scrollTop+=r.bottom-pr.bottom+90}
if(k>ws.length+12)clearInterval(lTimer)},200);

// ===== Background birthday music (synthesised music-box waltz, loops) =====
var MG,BGG,BGon=false,BGt=0,muted=false,BEAT=.55,EV=[];
(function(){var ch=[[48,60,64,67],[45,57,60,64],[41,53,57,60],[43,55,59,62]],
mel=[[[76,0,1],[79,1,1],[84,2,1]],[[81,0,1.5],[79,1.5,.5],[76,2,1]],[[77,0,1],[81,1,1],[77,2,1]],[[74,0,1],[79,1,1],[83,2,1]],[[84,0,1.5],[83,1.5,.5],[79,2,1]],[[76,0,1],[81,1,1],[84,2,1]],[[81,0,1],[79,1,.5],[77,1.5,.5],[76,2,1]],[[74,0,1],[71,1,1],[72,2,1]]];
for(var b=0;b<8;b++){var c=ch[b%4],o=b*3;EV.push([o,c[0],2.6,.2]);EV.push([o+1,c[2],1.4,.07]);EV.push([o+2,c[3],1.4,.07]);
mel[b].forEach(function(m){EV.push([o+m[1],m[0],Math.max(1.2,m[2]),.15])})}})();
function mnote(m,t,d,v){var f=440*Math.pow(2,(m-69)/12);[[f,1],[f*3,.25]].forEach(function(p,i){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=p[0];
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v*p[1],t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+(i?d*.35:d));o.connect(g);g.connect(BGG);o.start(t);o.stop(t+d+.05)})}
function bgTick(){if(!BGon)return;while(BGt<AC.currentTime+2){EV.forEach(function(e){mnote(e[1],BGt+e[0]*BEAT,e[2]*BEAT,e[3])});BGt+=24*BEAT}}
function startBG(){if(BGon||!AC)return;MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);BGG=AC.createGain();BGG.connect(MG);BGon=true;BGt=AC.currentTime+.3;bgTick();setInterval(bgTick,500)}
function duck(s){if(!BGG)return;var t=AC.currentTime;BGG.gain.cancelScheduledValues(t);BGG.gain.setTargetAtTime(.2,t,.3);BGG.gain.setTargetAtTime(1,t+s,.8)}
document.getElementById('snd').onclick=function(){muted=!muted;if(MG)MG.gain.setTargetAtTime(muted?0:1,AC.currentTime,.08);this.textContent=muted?'🔇':'🔊'};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&AC&&AC.state!='running')AC.resume()});
